@if (usuario(); as user) {
    <div class="container py-5">
        <div class="card shadow-sm border-0 tarjeta-info-usuario mx-auto">
            <div class="card-body p-3 p-md-4">
                <div class="row align-items-center g-0">

                    <div class="col-12 col-md-5 text-center columna-avatar pb-4 pb-md-0 pe-md-4 mb-4 mb-md-0">
                        <img [src]="user.image" [alt]="user.first_name" class="rounded-circle imagen-usuario">
                    </div>

                    <div class="col-12 col-md-7 ps-md-4 text-center text-md-start">
                        <p class="mb-2 dato-usuario">
                            <span class="fw-semibold">Nombre:</span> {{ user.first_name }}
                        </p>
                        <p class="mb-2 dato-usuario">
                            <span class="fw-semibold">Apellido:</span> {{ user.last_name }}
                        </p>
                        <p class="mb-2 dato-usuario">
                            <span class="fw-semibold">Nombre Usuario:</span> {{ user.username }}
                        </p>
                        <p class="mb-4 dato-usuario">
                            <span class="fw-semibold">Email:</span> {{ user.email }}
                        </p>

                        <div class="d-flex flex-column flex-sm-row gap-2">
                            <button (click)="borrar()" class="btn btn-outline-danger action-btn">Eliminar</button>
                            <a [routerLink]="['/updateuser', user._id]" class="btn btn-outline-primary action-btn">Actualizar</a>
                            <a [routerLink]="['/home']" class="btn btn-outline-secondary action-btn">Volver a listado</a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
}
